<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>RBWR Operator Manual</title>
        <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <script src="theme.js"></script>
        <link rel="stylesheet" href="theme.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="topbar-title">RBWR Operator Manual</div>
            <div class="search-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="Search pages…" autocomplete="off" />
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="topbar-spacer"></div>
            <div class="topbar-toggles">
                <button class="theme-btn" data-theme="light">Light</button>
                <button class="theme-btn active" data-theme="dark">Dark</button>
                <button class="theme-btn" data-theme="oled">OLED</button>
                <button class="toggle-btn" id="nerd-toggle" onclick="toggleNerd()"><span class="dot"></span><span>nerd mode</span></button>
            </div>
        </div>

        <div class="filter-bar" id="filter-bar">
            <div class="filter-group">
                <span class="filter-group-label">unit</span>
                <button class="filter-btn active" id="fb-unit-u1" onclick="setFilter('unit', 'u1')">U1</button>
                <button class="filter-btn" id="fb-unit-u2" onclick="setFilter('unit', 'u2')">U2</button>
            </div>
            <div class="filter-group filter-group-mode">
                <span class="filter-group-label">mode</span>
                <button class="filter-btn active" id="fb-mode-simple" onclick="setFilter('mode', 'simple')">simple</button>
                <button class="filter-btn" id="fb-mode-realistic" onclick="setFilter('mode', 'realistic')">realistic</button>
            </div>
            <div class="filter-group">
                <span class="filter-group-label">reactor</span>
                <button class="filter-btn active" id="fb-reactor-classic" onclick="setFilter('reactor', 'classic')">classic</button>
                <button class="filter-btn" id="fb-reactor-stable" onclick="setFilter('reactor', 'stable')">stable</button>
                <button class="filter-btn" id="fb-reactor-selfcirc" onclick="setFilter('reactor', 'selfcirc')">self-circ</button>
                <button class="filter-btn" id="fb-reactor-rbmk" onclick="setFilter('reactor', 'rbmk')">RBMK</button>
            </div>
        </div>

        <div class="layout">
            <nav class="sidebar" id="sidebar">
                <button class="nav-item" onclick="loadPage('intro')" data-page="intro">Welcome</button>
                <button class="nav-item" onclick="loadPage('plant-overview')" data-page="plant-overview">How the Plant Works</button>

                <div class="nav-group-title">ops</div>
                <button class="nav-item" onclick="loadPage('startup')" data-page="startup">Startup</button>
                <button class="nav-item" onclick="loadPage('shutdown')" data-page="shutdown">Shutdown</button>
                <button class="nav-item" onclick="loadPage('operation')" data-page="operation">Normal Operation</button>
                <button class="nav-item" onclick="loadPage('emergencies')" data-page="emergencies">Emergencies</button>

                <div class="nav-group-title">reactor</div>
                <button class="nav-item" onclick="loadPage('reactor-control')" data-page="reactor-control">Reactor Control</button>
                <button class="nav-item" onclick="loadPage('xenon')" data-page="xenon">Xenon &amp; Iodine</button>
                <button class="nav-item" onclick="loadPage('reactor-hall')" data-page="reactor-hall">Reactor Hall &amp; Refueling</button>

                <div class="nav-group-title">water</div>
                <button class="nav-item" onclick="loadPage('mcc')" data-page="mcc">MCC - Cooling &amp; Water</button>
                <button class="nav-item" onclick="loadPage('condenser')" data-page="condenser">Condenser &amp; Deaerator</button>
                <button class="nav-item nav-u2" onclick="loadPage('u2-polishers')" data-page="u2-polishers">CIX - Polishers</button>

                <div class="nav-group-title">power</div>
                <button class="nav-item nav-u2" onclick="loadPage('u2-tcr')" data-page="u2-tcr">TCR - Turbine Control Room</button>
                <button class="nav-item nav-u2" onclick="loadPage('u2-fwp')" data-page="u2-fwp">FWP - Feedwater Pump Bay</button>
                <button class="nav-item" onclick="loadPage('electrical')" data-page="electrical">Electrical &amp; EDG</button>

                <div class="nav-group-title">support</div>
                <button class="nav-item" onclick="loadPage('aux-systems')" data-page="aux-systems">RHR &amp; ECCS</button>
                <button class="nav-item" onclick="loadPage('malfunctions')" data-page="malfunctions">Malfunctions</button>
                <button class="nav-item" onclick="loadPage('u2-supervisor')" data-page="u2-supervisor">Supervisor Room</button>

                <div class="nav-group-title">faults</div>
                <button class="nav-item" onclick="loadPage('ts-reactor')" data-page="ts-reactor">Reactor</button>
                <button class="nav-item" onclick="loadPage('ts-cooling')" data-page="ts-cooling">Cooling, Condenser &amp; Chemistry</button>
                <button class="nav-item" onclick="loadPage('ts-turbine')" data-page="ts-turbine">Turbine &amp; TCR</button>
                <button class="nav-item" onclick="loadPage('ts-electrical')" data-page="ts-electrical">Electrical &amp; EDG</button>

                <div class="nav-group-title">reference</div>
                <button class="nav-item" onclick="loadPage('limits')" data-page="limits">Limits &amp; Setpoints</button>
                <button class="nav-item" onclick="loadPage('points')" data-page="points">Points, Events &amp; Inspection</button>
                <button class="nav-item" onclick="loadPage('reactor-types')" data-page="reactor-types">Reactor Types &amp; Server Config</button>
                <button class="nav-item" onclick="loadPage('u2-differences')" data-page="u2-differences">U1 vs U2</button>
                <button class="nav-item" onclick="loadPage('glossary')" data-page="glossary">Reference &amp; Glossary</button>
            </nav>

            <main class="content">
                <div class="content-inner md" id="content">
                    <div class="status">Loading…</div>
                </div>
            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
